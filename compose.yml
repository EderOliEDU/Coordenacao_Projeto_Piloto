services:

# :::::::::  Servidor de Desenvolvimento  :::::::::

  backend-dev:
    profiles: ["dev"]
    build: ./backend
    env_file:
      - ./backend/.env_dev
    environment:
      - NODE_ENV=development
      - AUDIO_STORAGE_PATH=/opt/projeto_piloto_app/data/audios
    volumes:
      - /opt/projeto_piloto_app/data/audios:/opt/projeto_piloto_app/data/audios
    ports:
      - "3001:3001"
    restart: always

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        NGINX_CONF: "nginx.dev.conf"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "5173:443"
    depends_on:
      - backend-dev
    restart: always

# :::::::::  Servidor de Produção  :::::::::

  backend-prod:
    profiles: ["prod"]
    build: ./backend
    env_file:
      - ./backend/.env_prod
    environment:
      - NODE_ENV=production
      - PILOTO_PG_HOST=192.168.0.121
    ports:
      - "3001:3001"
    restart: always

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://192.168.0.122:3001"
        NGINX_CONF: "nginx.prod.conf"
    volumes:
      - ./nginx.prod.override.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - backend-prod
    restart: always
    networks:
      default:
      web-proxy:
        aliases:
          - fonica-frontend

volumes:
  pg_dev:

networks:
  web-proxy:
    external: true
