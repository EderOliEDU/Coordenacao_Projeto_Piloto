services:

# :::::::::  Servidor de Desenvolvimento  :::::::::

  backend-dev:
    profiles: ["dev"]
    build: ./backend
    env_file:
      - ./backend/.env_dev
    environment:
      - NODE_ENV=development
    ports:
      - "3001:3001"
    restart: always

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://172.17.2.42:3001"
        NGINX_CONF: "nginx.dev.conf"
    ports:
      - "5173:80"
    depends_on:
      - backend-dev
    restart: always

# :::::::::  Servidor de Produção  :::::::::

  backend-prod:
    profiles: ["prod"]
    build: ./backend
    env_file:
      - ./backend/.env_prod
    environment:
      - NODE_ENV=production
      - PILOTO_PG_HOST=192.168.0.121
    ports:
      - "3001:3001"
    restart: always

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://192.168.0.122:3001"
        NGINX_CONF: "nginx.prod.conf"
    volumes:
      - ./nginx.prod.override.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - backend-prod
    restart: always

volumes:
  pg_dev:
