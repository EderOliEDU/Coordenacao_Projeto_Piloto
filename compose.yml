services:

# :::::::::  Servidor de Deselvovimento  :::::::::

  backend-dev:
    profiles: ["dev"]
    build: ./backend
    env_file:
      - ./backend/.env_dev
    environment:
      - NODE_ENV=development
    ports:
      - "3001:3001"
    restart: always

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://172.17.2.42:3001"
        NGINX_CONF: "nginx.dev.conf"
    ports:
      - "5173:80"
    depends_on:
      - backend-dev
    restart: always

volumes:
  pg_dev:
